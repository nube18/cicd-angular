name: Angular CI/CD

# Eventos que inician el workflow: push a main y pull requests dirigidas a main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Trabajos que GitHub Actions ejecuta dentro del workflow.
jobs:
  build:
    runs-on: ubuntu-latest
    # Permite leer el repositorio para descargar el código.
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npx ng build --base-href /cicd-angular/

      # En una PR solo se valida; el artefacto se publica únicamente en un push.
      - name: Subir artefacto de Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cicd-angular/browser

  # El despliegue espera a que build termine correctamente.
  deploy:
    needs: build
    # Despliega solo cuando el push corresponde a la rama main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Autoriza publicar en GitHub Pages y solicitar el token OIDC.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
