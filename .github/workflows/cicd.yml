name: Angular CI/CD

# ON: define los eventos que disparan el workflow.
# Se ejecuta en cada push a main (CI + despliegue) y en cada pull request
# dirigida a main (solo CI, para validar antes de fusionar).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# JOBS: conjunto de trabajos del workflow. Por defecto se ejecutan en paralelo,
# salvo que se encadenen con "needs". Aquí hay dos: build (validar y empaquetar)
# y deploy (publicar).
jobs:
  build:
    runs-on: ubuntu-latest
    # PERMISSIONS (job build): principio de mínimo privilegio.
    # Solo necesita leer el repositorio para descargar el código.
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests con cobertura
        run: npx ng test --no-watch --coverage

      # IF (step): always() hace que el informe se suba aunque fallen los tests,
      # para poder consultarlo al depurar.
      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Compilar Angular
        run: npx ng build --base-href /cicd-angular/

      # IF (step): en una PR solo se valida; el artefacto de Pages
      # se publica únicamente cuando el evento es un push.
      - name: Subir artefacto de Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cicd-angular/browser

  deploy:
    # NEEDS: este job espera a que "build" termine correctamente.
    # Si build falla, deploy no se ejecuta.
    needs: build
    # IF (job): solo se despliega en un push a la rama main,
    # nunca en pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # PERMISSIONS (job deploy): permisos específicos para publicar en Pages.
    # pages: write permite desplegar; id-token: write permite a deploy-pages
    # verificar el origen del despliegue mediante OIDC.
    permissions:
      pages: write
      id-token: write
    # ENVIRONMENT: asocia el job al entorno "github-pages" y expone
    # la URL publicada en la interfaz de GitHub.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4